      OIDC_ISSUER: http://localhost:28081/realms/food
  order-worker:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  agent-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  benefit-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  control-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
  payment-service:
    environment:
      OIDC_ISSUER: http://localhost:28081/realms/food
      ENABLE_FAULTS: "true"
