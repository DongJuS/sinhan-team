server:
  port: 8080
spring:
  application:
    name: benefit-service
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    url: ${DB_URL:jdbc:postgresql://postgres:5432/food?currentSchema=benefits}
    username: ${DB_USER:benefits_app}
    password: ${DB_PASSWORD:benefits_dev_only}
  flyway:
    default-schema: benefits
    schemas: benefits
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
logging:
  structured:
    format:
      console: logstash
