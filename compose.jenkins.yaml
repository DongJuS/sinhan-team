name: sinhan-jenkins
services:
  docker:
    image: docker:28.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    entrypoint: ["sh", "-c", "mkdir -p /workspace && chown 1000:1000 /workspace && exec dockerd-entrypoint.sh --storage-driver=overlay2"]
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs:/certs/client
      - workspace:/workspace
    ports:
      - "127.0.0.1:38080:18080"
      - "127.0.0.1:38081:18081"
    healthcheck:
      test: ["CMD-SHELL", "docker --host=tcp://localhost:2376 --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem info >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  jenkins:
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - jenkins-home:/var/jenkins_home
      - workspace:/workspace
      - docker-certs:/certs/client:ro
    secrets: [jenkins_admin_password]
    ports: ["127.0.0.1:18090:8080"]
    depends_on:
      docker: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped
volumes:
  jenkins-home:
  workspace:
  docker-data:
  docker-certs:
secrets:
  jenkins_admin_password:
    file: ./.ci-secrets/jenkins_admin_password
